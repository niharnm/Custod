<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Custod</title>
  </head>
  <body>
    <!-- Auth gate -->
    <div id="authView" class="auth-view hidden">
      <header class="header">
        <span class="brand">Custod</span>
      </header>
      <div class="auth-body">
        <h2 id="authTitle" class="auth-title">Sign in</h2>
        <p class="auth-sub">Track visits in hourly sessions while signed in.</p>
        <button id="googleSignIn" type="button" class="google-btn">
          <svg class="google-icon" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or</span></div>
        <form id="authForm" class="auth-form">
          <label class="auth-label">
            Email
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label class="auth-label">
            Password
            <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" />
          </label>
          <div id="authError" class="auth-error hidden"></div>
          <button id="authSubmit" type="submit" class="auth-submit">Sign in</button>
        </form>
        <button id="authToggle" type="button" class="auth-toggle">
          Need an account? Create one
        </button>
        <button id="authSkip" type="button" class="auth-skip">
          Continue without an account
        </button>
      </div>
    </div>

    <!-- Main dashboard -->
    <div id="appView" class="hidden">
      <header class="header">
        <span class="brand">Custod</span>
        <div class="header-right">
          <span id="statusDot" class="status-dot"></span>
          <button id="logoutBtn" type="button" class="logout-btn" title="Log out">Log out</button>
        </div>
      </header>
      <div id="userEmail" class="user-email"></div>

      <div id="signinNudge" class="signin-nudge hidden">
        <span>Sign in to sync your focus across your devices.</span>
        <button id="nudgeSignIn" type="button">Sign in</button>
      </div>

      <div class="ring-wrap">
        <canvas id="ring" width="140" height="140"></canvas>
        <div class="ring-center">
          <div id="scoreNum" class="score-num">–</div>
          <div id="statusLabel" class="status-label">Loading…</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div id="statTabs" class="stat-val">–</div>
          <div class="stat-label">tabs</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div id="statSwitches" class="stat-val">–</div>
          <div class="stat-label">switches/min</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div id="statSession" class="stat-val">–</div>
          <div class="stat-label">active today</div>
        </div>
      </div>

      <div class="divider"></div>

      <div id="triggers" class="triggers"></div>
      <div id="intervention" class="intervention"></div>
      <div id="actions" class="actions"></div>

      <div class="sparkline-label">7-day trend</div>
      <canvas id="sparkline" width="280" height="48" class="sparkline"></canvas>

      <div class="privacy">
        Visits are logged as URL + title in hourly sessions. Switches include tab, title, and URL changes.
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
