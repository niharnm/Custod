<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="welcome.css" />
    <title>Welcome to Custod</title>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="icons/icon128.png" alt="" width="44" height="44" />
        <span>Custod</span>
      </div>

      <!-- Sign-in step -->
      <section id="signinStep">
        <h1 id="title">Sign in to start</h1>
        <p class="sub">
          Custod keeps your focus in sync across your Mac and browser. Sign in
          once and your account follows you everywhere.
        </p>

        <button id="googleSignIn" type="button" class="google-btn">
          <svg class="google-icon" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <div class="divider"><span>or</span></div>

        <form id="authForm" class="form">
          <label class="label">
            Email
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label class="label">
            Password
            <input id="password" type="password" autocomplete="current-password" required minlength="6" />
          </label>
          <div id="error" class="error hidden"></div>
          <button id="submit" type="submit" class="submit">Sign in</button>
        </form>

        <button id="toggle" type="button" class="toggle">Need an account? Create one</button>
        <button id="skip" type="button" class="skip">Continue without an account</button>
      </section>

      <!-- Success step -->
      <section id="doneStep" class="hidden">
        <div class="check">✓</div>
        <h1>You're all set</h1>
        <p class="sub" id="doneMsg">Signed in. Custod is now watching your focus in real time.</p>
        <button id="close" type="button" class="submit">Start using Custod</button>
        <p class="fine">Click the Custod icon in your toolbar any time to see your score.</p>
      </section>
    </main>

    <script src="welcome.js"></script>
  </body>
</html>
